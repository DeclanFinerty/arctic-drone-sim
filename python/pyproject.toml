[project]
name = "arctic-sim"
version = "0.1.0"
description = "Data ingestion, processing, and visualization for the Arctic drone simulation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "xarray>=2024.6",
    "matplotlib>=3.8",
    "plotly>=5.22",
    "polars>=1.0",
    "rasterio>=1.4.4",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctic_sim"]
