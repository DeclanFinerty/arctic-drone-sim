# Default simulation config. All quantities SI unless noted.

seed = 42

[wind_field]
# Directory holding u/v/w .npy + metadata.json from a wind-field example.
load_from = "output/wind_fields/mann_anisotropic"
# Physical domain size in meters (x, y, z); descriptive only when loading from disk.
domain = [1280.0, 1280.0, 320.0]
grid = [128, 128, 32]
mean_speed_ms = 5.715
reference_height_m = 10.0
z0_m = 0.001
hub_height_m = 30.0

[wind_field.mann]
# See PHASE1.md for how these were derived and calibrated.
alpha_epsilon_23 = 0.163
length_scale_m = 16.800
gamma = 3.9

[drone]
# Small commercial-class quadrotor.
mass_kg = 1.5
max_thrust_n = 30.0
max_wind_speed_ms = 15.0
max_speed_ms = 20.0
battery_capacity_wh = 100.0
drag_area_m2 = 0.05
drag_coefficient = 1.0
# Arctic ~0 C sea level.
air_density_kgm3 = 1.29
# Linear battery-drain approximation; ~100 W at 15 N hover thrust.
power_per_thrust_w_per_n = 6.7

[controller]
# PID-with-velocity-feedback gains tuned for the 1.5 kg quad above.
# Natural frequency sqrt(kp/m) ~= 2.6 rad/s, damping ratio ~= 0.77.
kp = 10.0
kv = 6.0
ki = 0.5

[mission]
# Hover at mid-domain, drone-operational altitude.
target_m = [640.0, 640.0, 30.0]
tolerance_m = 1.0
# Start 10 m upwind and 8 m lateral so the controller has to converge.
initial_position_m = [630.0, 632.0, 30.0]

[simulation]
duration_s = 60.0
dt_s = 0.01

[output]
directory = "output"
