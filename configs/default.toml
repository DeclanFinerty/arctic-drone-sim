# Default simulation config. All quantities SI unless noted.

seed = 42

[wind_field]
# Physical domain size in meters (x, y, z).
domain = [2000.0, 2000.0, 200.0]
# Grid resolution (nx, ny, nz).
grid = [128, 128, 32]
# Mean wind speed [m/s] at reference height, from REA Point 2024 observations.
mean_speed_ms = 5.715
reference_height_m = 10.0
# Log-law surface roughness [m]: flat Arctic snow/ice.
z0_m = 0.001
# Target hub altitude used to derive Mann parameters.
hub_height_m = 30.0

[wind_field.mann]
# IEC 61400-1 Ed 4 defaults, class C (offshore/smooth), derived by
# python/scripts/derive_mann_params.py from REA Point 2024 climatology
# (V_hub = 6.40 m/s at z = 30 m, sigma_u_target = 1.25 m/s, TI = 19.5%).
#
# alpha_epsilon_23 was empirically calibrated by running the isotropic Mann
# generator on a 128x128x32 grid at 10 m spacing and rescaling until the
# measured sigma_u matched the IEC target. Initial IEC-formula estimate was
# 0.0742; calibrated value 0.585 accounts for the (2/3)-of-TKE-per-component
# projection and finite-grid high-k truncation. Rescale again if the grid
# resolution or physical domain changes materially.
alpha_epsilon_23 = 0.585
length_scale_m = 16.800
gamma = 3.9

[simulation]
duration_s = 60.0
dt_s = 0.01

[output]
directory = "output"
