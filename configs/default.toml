# Default simulation config. All quantities SI unless noted.

seed = 42

[wind_field]
# Physical domain size in meters (x, y, z).
domain = [2000.0, 2000.0, 200.0]
# Grid resolution (nx, ny, nz).
grid = [128, 128, 32]
# Mean wind speed [m/s] at reference height, from REA Point 2024 observations.
mean_speed_ms = 5.715
reference_height_m = 10.0
# Log-law surface roughness [m]: flat Arctic snow/ice.
z0_m = 0.001
# Target hub altitude used to derive Mann parameters.
hub_height_m = 30.0

[wind_field.mann]
# Anisotropic Mann model parameters, calibrated for the anisotropic RDT
# generator on a 128x128x32 grid at 10 m spacing. Target: sigma_u = 1.25 m/s
# (IEC NTM class C at V_hub = 6.40 m/s, from REA Point 2024 climatology).
#
# Measured on target grid at these values:
#   sigma_u = 1.248 m/s   (target 1.25)
#   sigma_v/sigma_u = 0.69   (published Mann at Gamma=3.9 gives ~0.7)
#   sigma_w/sigma_u = 0.47   (published Mann at Gamma=3.9 gives ~0.5)
#
# Isotropic generator uses a different alpha (0.585) at the same grid; the
# anisotropic RDT concentrates ~1.5x more energy in u for the same alpha, so
# anisotropic alpha is proportionally smaller. Recalibrate whenever the grid
# resolution or physical domain changes.
alpha_epsilon_23 = 0.163
length_scale_m = 16.800
gamma = 3.9

[simulation]
duration_s = 60.0
dt_s = 0.01

[output]
directory = "output"
